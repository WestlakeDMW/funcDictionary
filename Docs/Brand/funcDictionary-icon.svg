<title id="title">funcDictionary icon</title>
<desc id="desc">Minimal serif wordmark. Large regular italic func sits above Dictionary, with optical left alignment of the main letter strokes. A small softly dotted thinking ring adds an AI accent at the upper right. Pale mint and ivory lettering on a deep teal background.</desc>
